[supervisord]
nodaemon = true
user = root
logfile = /proc/self/fd/2
logfile_maxbytes = 0

[program:php-fpm]
command = php-fpm -F
autostart = true
autorestart = true
stdout_logfile = /proc/self/fd/2
stderr_logfile = /proc/self/fd/2

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
stdout_logfile = /proc/self/fd/2
stderr_logfile = /proc/self/fd/2

[program:queue]
command = php /app/artisan queue:listen --tries=1 --timeout=0
autostart = true
autorestart = true
stdout_logfile = /proc/self/fd/2
stderr_logfile = /proc/self/fd/2
user = app
numprocs = 2
process_name = queue-%(process_num)s

[program:scheduler]
command = /bin/sh -c "while true; do php /app/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart = true
autorestart = true
stdout_logfile = /proc/self/fd/2
stderr_logfile = /proc/self/fd/2
user = app
