version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nalabumi-app
    container_name: nalabumi-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app:z
      - ./env.docker:/app/.env:z
      - /app/node_modules
      - /app/vendor
    environment:
      - DB_HOST=db
      - DB_CONNECTION=mysql
      - DB_DATABASE=nalabumi
      - DB_USERNAME=root
      - DB_PASSWORD=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    networks:
      - nalabumi-network
    command: php artisan serve --host=0.0.0.0 --port=8000

  vite:
    build:
      context: .
      dockerfile: Dockerfile
    image: nalabumi-app
    container_name: nalabumi-vite
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app:z
      - ./env.docker:/app/.env:z
      - /app/node_modules
      - /app/vendor
    depends_on:
      - app
    networks:
      - nalabumi-network
    command: npm run dev -- --host 0.0.0.0

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: nalabumi-app
    container_name: nalabumi-queue
    restart: unless-stopped
    volumes:
      - .:/app:z
      - ./env.docker:/app/.env:z
      - /app/node_modules
      - /app/vendor
    environment:
      - DB_HOST=db
      - DB_CONNECTION=mysql
      - DB_DATABASE=nalabumi
      - DB_USERNAME=root
      - DB_PASSWORD=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    networks:
      - nalabumi-network
    command: php artisan queue:listen --tries=1 --timeout=0

  db:
    image: mysql:8.0
    container_name: nalabumi-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: nalabumi
    volumes:
      - mysql-data:/var/lib/mysql
      - ./nalabumi-2026_06_22_10_58_56-dump.sql:/docker-entrypoint-initdb.d/dump.sql:z
    networks:
      - nalabumi-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nalabumi-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - nalabumi-network

  scheduler:
    image: nalabumi-app
    container_name: nalabumi-scheduler
    restart: unless-stopped
    volumes:
      - .:/app:z
      - ./env.docker:/app/.env:z
      - /app/node_modules
      - /app/vendor
    environment:
      - DB_HOST=db
      - DB_CONNECTION=mysql
      - DB_DATABASE=nalabumi
      - DB_USERNAME=root
      - DB_PASSWORD=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - qdrant
    networks:
      - nalabumi-network
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

networks:
  nalabumi-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  qdrant-data:
    driver: local
