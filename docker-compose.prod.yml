services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: nalabumi-php:production
    container_name: nalabumi-php
    restart: unless-stopped
    volumes:
      - storage-data:/app/storage:z
    env_file:
      - env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_started
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - nalabumi-network
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: nalabumi-nginx:production
    container_name: nalabumi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - storage-data:/app/storage:z
    depends_on:
      - php
    networks:
      - nalabumi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  queue:
    image: nalabumi-php:production
    pull_policy: never
    container_name: nalabumi-queue
    restart: unless-stopped
    volumes:
      - storage-data:/app/storage:z
    env_file:
      - env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      php:
        condition: service_started
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_started
    networks:
      - nalabumi-network
    command: php artisan queue:listen --tries=1 --timeout=0

  scheduler:
    image: nalabumi-php:production
    pull_policy: never
    container_name: nalabumi-scheduler
    restart: unless-stopped
    volumes:
      - storage-data:/app/storage:z
    env_file:
      - env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      php:
        condition: service_started
      mariadb:
        condition: service_healthy
    networks:
      - nalabumi-network
    command: /bin/sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

  mariadb:
    image: mariadb:11.4
    container_name: nalabumi-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: nalabumi
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./nalabumi-2026_06_22_10_58_56-dump.sql:/docker-entrypoint-initdb.d/dump.sql:z
    expose:
      - "3306"
    networks:
      - nalabumi-network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  valkey:
    image: valkey/valkey:8.1
    container_name: nalabumi-valkey
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    expose:
      - "6379"
    networks:
      - nalabumi-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nalabumi-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-storage:/qdrant/storage
    expose:
      - "6333"
    networks:
      - nalabumi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: nalabumi-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    networks:
      - nalabumi-network
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 2 && ollama pull bge-m3 && wait"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  nalabumi-network:
    driver: bridge

volumes:
  mariadb-data:
    driver: local
  qdrant-storage:
    driver: local
  ollama-data:
    driver: local
  valkey-data:
    driver: local
  storage-data:
    driver: local
